---
layout: default
title: 검색
permalink: /search/
---
<div class="page-content">
  <h1>검색</h1>
  <div class="search-box">
    <input type="text" id="search-input" placeholder="제목, 설명, 태그, 카테고리로 검색..." autocomplete="off">
  </div>
  <div id="search-results"></div>
</div>

<script>
(function () {
  var data = null;
  var input = document.getElementById('search-input');
  var results = document.getElementById('search-results');
  var timer;

  function load(cb) {
    if (data) { cb(); return; }
    fetch('/search.json')
      .then(function (r) { return r.json(); })
      .then(function (d) { data = d; cb(); })
      .catch(function () { results.innerHTML = '<p class="search-no-results">데이터를 불러올 수 없습니다.</p>'; });
  }

  function escape(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function highlight(text, q) {
    if (!text) return '';
    return text.replace(new RegExp('(' + escape(q) + ')', 'gi'), '<mark>$1</mark>');
  }

  function run(query) {
    var q = query.trim();
    if (q.length < 1) { results.innerHTML = ''; return; }
    var ql = q.toLowerCase();

    var matched = data.filter(function (p) {
      return (p.title && p.title.toLowerCase().indexOf(ql) >= 0) ||
             (p.description && p.description.toLowerCase().indexOf(ql) >= 0) ||
             (p.categories && p.categories.toLowerCase().indexOf(ql) >= 0) ||
             (p.tags && p.tags.toLowerCase().indexOf(ql) >= 0);
    });

    if (matched.length === 0) {
      results.innerHTML = '<p class="search-no-results">"' + q + '"에 대한 결과가 없습니다.</p>';
      return;
    }

    var html = '<p class="search-count">' + matched.length + '개의 글을 찾았습니다.</p><ul class="post-list">';
    matched.forEach(function (p) {
      html += '<li>';
      html += '<a class="post-title" href="' + p.url + '">' + highlight(p.title, q) + '</a>';
      html += '<div class="post-meta"><span class="post-date">' + p.date + '</span>';
      if (p.categories) html += ' <span class="category-tag">' + p.categories + '</span>';
      html += '</div>';
      if (p.description) html += '<p class="post-desc">' + highlight(p.description, q) + '</p>';
      html += '</li>';
    });
    html += '</ul>';
    results.innerHTML = html;
  }

  input.addEventListener('input', function () {
    var val = this.value;
    clearTimeout(timer);
    timer = setTimeout(function () { load(function () { run(val); }); }, 200);
  });

  var params = new URLSearchParams(window.location.search);
  var q = params.get('q');
  if (q) { input.value = q; load(function () { run(q); }); }
  else { input.focus(); }
})();
</script>
