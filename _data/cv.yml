cv:
  name: 해피쯔닝
  label: AI/데이터 사이언스 교육자
  email: zhining@naver.com
  website: https://zzhining.github.io
  summary: >
    AI와 데이터 사이언스를 가르치며, 배우고 나누는 즐거움을 공유하는 교육자입니다.
    생성형 AI, 파이썬, 데이터 분석, 머신러닝·딥러닝 등 다양한 분야에서 200시간 이상의
    강의 경험과 4권의 기술 도서 저술, 10개 이상의 기관 컨설팅 경험을 보유하고 있습니다.

  sections:
    Experience:
      - company: 기업체·공공기관·대학교 등
        position: AI/데이터 사이언스 전문 강사
        start_date: "2018"
        highlights:
          - "생성형 AI (ChatGPT, Claude, Gemini 활용), 프롬프트 엔지니어링 강의"
          - "파이썬 기초 및 심화, 데이터 분석, 머신러닝·딥러닝 강의"
          - "대시보드 생성 (Streamlit, Tableau, Power BI) 강의"
          - "소프트웨어 엔지니어링 기초 (Git, Docker, API 개발) 강의"
          - "10개 이상의 기업·기관 컨설팅 및 강의 수행"
          - "총 200시간 이상 강의 진행"

    Publications:
      - title: AI 시대의 데이터 분석
        releaseDate: "2024"
        publisher: 출판사
        summary: 생성형 AI를 활용한 데이터 분석 실무 가이드
      - title: 파이썬으로 시작하는 머신러닝
        releaseDate: "2023"
        publisher: 출판사
        summary: 머신러닝 입문자를 위한 실습 중심 교재
      - title: 데이터 시각화의 모든 것
        releaseDate: "2022"
        publisher: 출판사
        summary: Matplotlib, Seaborn, Plotly를 활용한 시각화 완벽 가이드
      - title: 실전 파이썬 데이터 분석
        releaseDate: "2021"
        publisher: 출판사
        summary: Pandas, NumPy를 활용한 데이터 분석 실전 교재

    Skills:
      - name: 프로그래밍 언어
        keywords:
          - Python
          - R
          - SQL
      - name: 머신러닝/딥러닝
        keywords:
          - TensorFlow
          - PyTorch
          - Scikit-learn
          - Keras
      - name: 데이터 처리
        keywords:
          - Pandas
          - NumPy
      - name: 웹/대시보드
        keywords:
          - Streamlit
          - Django
          - Flask
          - FastAPI
      - name: 데이터베이스
        keywords:
          - MySQL
          - MongoDB
          - PostgreSQL
      - name: 도구 및 플랫폼
        keywords:
          - Git / GitHub
          - Docker
          - Jupyter Notebook
          - AWS

    강의 분야:
      - bullet: "**생성형AI**: ChatGPT, Claude, Gemini 활용, 프롬프트 엔지니어링, RAG 시스템 구축"
      - bullet: "**파이썬 기초**: 파이썬 문법, 함수, 객체지향 프로그래밍"
      - bullet: "**데이터분석**: 탐색적 데이터 분석, 통계 분석, 시각화"
      - bullet: "**대시보드 생성**: Streamlit, Tableau, Power BI"
      - bullet: "**머신러닝·딥러닝**: 지도/비지도 학습, CNN, RNN, Transformer"
      - bullet: "**데이터**: 데이터베이스 설계, SQL 최적화, 데이터 파이프라인"
      - bullet: "**소프트웨어엔지니어링**: Git, Docker, REST API, CI/CD"
