<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="해피쯔닝 블로그 - 모든 글 목록">
  <title>글 목록 - 해피쯔닝 블로그</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">해피쯔닝 ✨</a>
      <ul class="nav-links">
        <li><a href="index.html">홈</a></li>
        <li><a href="posts.html">글 목록</a></li>
        <li><a href="about.html">소개</a></li>
      </ul>
      <button id="themeToggle" class="theme-toggle" aria-label="다크 모드로 변경">🌙</button>
      <button class="hamburger" id="hamburger" aria-label="메뉴 열기">☰</button>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1>글 목록</h1>
      <p>AI, 머신러닝, 데이터 분석에 관한 이야기를 나눕니다.</p>
    </div>
  </header>

  <main class="posts-page">
    <div class="container">

      <!-- Category Filter -->
      <div class="posts-filter">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="genai">생성형 AI</button>
        <button class="filter-btn" data-filter="ml">머신러닝</button>
        <button class="filter-btn" data-filter="data">데이터 분석</button>
        <button class="filter-btn" data-filter="edu">교육</button>
      </div>

      <!-- Posts List (dynamically rendered) -->
      <div id="all-posts-grid" class="all-posts-grid">
        <p style="color:var(--text-secondary);text-align:center;padding:40px 0;">글을 불러오는 중...</p>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2025 해피쯔닝 · <a href="mailto:zhining@naver.com">zhining@naver.com</a></p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
    function formatDate(str) {
      return str.replace(/-/g, '.');
    }

    async function loadPosts() {
      const grid = document.getElementById('all-posts-grid');
      try {
        const res = await fetch('posts/index.json');
        if (!res.ok) throw new Error('fetch failed');
        const posts = await res.json();

        if (posts.length === 0) {
          grid.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:40px 0;">아직 작성된 글이 없습니다.</p>';
          return;
        }

        grid.innerHTML = posts.map(post => `
          <article class="post-list-item" data-category="${post.category}">
            <div class="post-list-content">
              <div class="post-tag" style="margin-bottom:8px;">${post.categoryLabel}</div>
              <h3><a href="post.html?id=${post.id}">${post.title}</a></h3>
              <p>${post.description}</p>
            </div>
            <div class="post-list-meta">
              <span style="font-size:0.85rem;color:var(--text-secondary);">${formatDate(post.date)}</span>
              <a href="post.html?id=${post.id}" class="read-more" style="font-size:0.875rem;">읽기 →</a>
            </div>
          </article>
        `).join('');

        initFilter();
      } catch (e) {
        grid.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:40px 0;">글 목록을 불러올 수 없습니다.</p>';
      }
    }

    function initFilter() {
      const filterBtns = document.querySelectorAll('.filter-btn');
      const postItems = document.querySelectorAll('.post-list-item');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.dataset.filter;
          postItems.forEach(item => {
            item.style.display = (filter === 'all' || item.dataset.category === filter) ? '' : 'none';
          });
        });
      });
    }

    loadPosts();
  </script>
</body>
</html>
