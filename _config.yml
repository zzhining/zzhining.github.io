title: AI 번역가, 쯔닝입니다
description: "생성형 AI·데이터 분석 강사이자 컨설턴트 쯔닝의 블로그. 직장인을 위한 AI 활용법, Claude Code 실습, AI 에이전트 설계를 다룹니다."
url: "https://zzhining.github.io"
baseurl: ""
timezone: Asia/Seoul

markdown: kramdown
highlighter: rouge

kramdown:
  hard_wrap: true
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  lectures_genai:
    output: true
    permalink: /lectures/genai/:name/
  lectures_data:
    output: true
    permalink: /lectures/data/:name/

defaults:
  - scope:
      path: ""
      type: lectures_genai
    values:
      layout: lecture
  - scope:
      path: ""
      type: lectures_data
    values:
      layout: lecture

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .bundle/
  - vendor/
