<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title>해피쯔닝 블로그</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">해피쯔닝 ✨</a>
      <ul class="nav-links">
        <li><a href="index.html">홈</a></li>
        <li><a href="posts.html">글 목록</a></li>
        <li><a href="about.html">소개</a></li>
      </ul>
      <button id="themeToggle" class="theme-toggle" aria-label="다크 모드로 변경">🌙</button>
      <button class="hamburger" id="hamburger" aria-label="메뉴 열기">☰</button>
    </div>
  </nav>

  <main class="post-page">
    <div class="container">

      <!-- Loading state -->
      <div id="post-loading" style="text-align:center;padding:80px 0;">
        <p style="color:var(--text-secondary);">글을 불러오는 중...</p>
      </div>

      <!-- Error state -->
      <div id="post-error" style="display:none;text-align:center;padding:80px 0;">
        <h2>글을 찾을 수 없습니다</h2>
        <p style="color:var(--text-secondary);margin:16px 0 32px;">요청하신 글이 존재하지 않거나 삭제되었습니다.</p>
        <a href="posts.html" class="btn btn-primary">글 목록으로 돌아가기</a>
      </div>

      <!-- Post content (rendered dynamically) -->
      <div id="post-wrapper" style="display:none;">

        <article class="post-article">
          <header class="post-header">
            <div id="post-tag" class="post-tag"></div>
            <h1 id="post-title"></h1>
            <div class="post-info">
              <span>✍️ 해피쯔닝</span>
              <span id="post-date"></span>
              <span id="post-read-time"></span>
            </div>
          </header>
          <hr class="post-divider">

          <div id="post-body" class="post-body"></div>

          <nav id="post-nav" class="post-nav" aria-label="이전/다음 글"></nav>
        </article>

        <aside class="post-sidebar">
          <nav id="toc" class="toc" aria-label="목차" style="display:none;">
            <h3>목차</h3>
            <ul id="toc-list"></ul>
          </nav>
          <div class="sidebar-card">
            <h3>다른 글</h3>
            <ul id="related-posts" style="list-style:none;display:flex;flex-direction:column;gap:8px;"></ul>
          </div>
        </aside>

      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2025 해피쯔닝 · <a href="mailto:zhining@naver.com">zhining@naver.com</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // ===========================
    // Frontmatter Parser
    // ===========================
    function parseFrontmatter(raw) {
      const match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
      if (!match) return { data: {}, content: raw };

      const lines = match[1].split('\n');
      const data = {};
      lines.forEach(line => {
        const colonIdx = line.indexOf(':');
        if (colonIdx === -1) return;
        const key = line.slice(0, colonIdx).trim();
        const val = line.slice(colonIdx + 1).trim().replace(/^["']|["']$/g, '');
        if (key) data[key] = val;
      });

      return { data, content: match[2] };
    }

    // ===========================
    // Format Date (YYYY-MM-DD → YYYY년 MM월 DD일)
    // ===========================
    function formatDate(str) {
      const [y, m, d] = str.split('-');
      return `📅 ${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
    }

    // ===========================
    // Build TOC from rendered HTML headings
    // ===========================
    function buildToc(bodyEl) {
      const headings = bodyEl.querySelectorAll('h2, h3');
      if (headings.length < 2) return;

      const tocList = document.getElementById('toc-list');
      const toc = document.getElementById('toc');

      headings.forEach((h, i) => {
        if (!h.id) h.id = 'heading-' + i;
        const li = document.createElement('li');
        if (h.tagName === 'H3') li.style.paddingLeft = '12px';
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        li.appendChild(a);
        tocList.appendChild(li);
      });

      toc.style.display = '';

      // TOC active highlight
      const tocLinks = tocList.querySelectorAll('a');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            tocLinks.forEach(link => {
              link.classList.toggle('active', link.getAttribute('href') === '#' + id);
            });
          }
        });
      }, { rootMargin: '-20% 0px -70% 0px' });
      headings.forEach(h => observer.observe(h));
    }

    // ===========================
    // Build post navigation
    // ===========================
    function buildPostNav(allPosts, currentId) {
      const idx = allPosts.findIndex(p => p.id === currentId);
      const nav = document.getElementById('post-nav');
      let html = '';

      if (idx > 0) {
        const prev = allPosts[idx - 1];
        html += `<a href="post.html?id=${prev.id}" class="post-nav-prev">← ${prev.title}</a>`;
      }
      if (idx < allPosts.length - 1) {
        const next = allPosts[idx + 1];
        html += `<a href="post.html?id=${next.id}" class="post-nav-next">${next.title} →</a>`;
      }

      nav.innerHTML = html;
    }

    // ===========================
    // Build related posts sidebar
    // ===========================
    function buildRelated(allPosts, currentId) {
      const others = allPosts.filter(p => p.id !== currentId).slice(0, 4);
      const ul = document.getElementById('related-posts');
      ul.innerHTML = others.map(p =>
        `<li><a href="post.html?id=${p.id}" style="font-size:0.875rem;color:var(--text-secondary);">${p.title}</a></li>`
      ).join('');
    }

    // ===========================
    // Load and render post
    // ===========================
    async function loadPost() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');

      if (!id) {
        showError();
        return;
      }

      try {
        const [mdRes, indexRes] = await Promise.all([
          fetch(`posts/${id}.md`),
          fetch('posts/index.json')
        ]);

        if (!mdRes.ok) { showError(); return; }

        const raw = await mdRes.text();
        const allPosts = indexRes.ok ? await indexRes.json() : [];
        const { data, content } = parseFrontmatter(raw);

        // Update page metadata
        document.title = `${data.title || '글'} - 해피쯔닝 블로그`;
        document.querySelector('meta[name="description"]').content = data.description || '';

        // Fill header
        document.getElementById('post-tag').textContent = data.categoryLabel || data.category || '';
        document.getElementById('post-title').textContent = data.title || '';
        document.getElementById('post-date').textContent = data.date ? formatDate(data.date) : '';
        document.getElementById('post-read-time').textContent = data.readTime ? `⏱️ ${data.readTime}` : '';

        // Render markdown
        marked.setOptions({ breaks: true, gfm: true });
        const bodyEl = document.getElementById('post-body');
        bodyEl.innerHTML = marked.parse(content);

        // Build sidebar and navigation
        buildToc(bodyEl);
        buildPostNav(allPosts, id);
        buildRelated(allPosts, id);

        // Show post
        document.getElementById('post-loading').style.display = 'none';
        document.getElementById('post-wrapper').style.display = '';

      } catch (e) {
        console.error(e);
        showError();
      }
    }

    function showError() {
      document.getElementById('post-loading').style.display = 'none';
      document.getElementById('post-error').style.display = '';
    }

    loadPost();
  </script>
</body>
</html>
